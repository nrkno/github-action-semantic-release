name: Notify PRs

on:
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Notify PRs
        # TODO(bump): v0.14.5 predates the container hardening and digest-pinned image. Bump to the
        # first release of this branch (commit SHA from the release summary) once it is published.
        uses: nrkno/github-action-semantic-release@v0.14.5
        with:
          subcommand: notify
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          SEMREL_TAG: ${{ github.event.release.tag_name }}
          SEMREL_VERSION: ${{ github.event.release.name }}
          SEMREL_RELEASE_URL: ${{ github.event.release.html_url }}
