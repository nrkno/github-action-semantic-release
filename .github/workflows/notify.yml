name: Notify PRs

on:
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Notify PRs
        uses: nrkno/github-action-semantic-release@5afff0e9b820879b997a3e381d09d1dc3941dc00 # v0.14.5
        with:
          subcommand: notify
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          SEMREL_TAG: ${{ github.event.release.tag_name }}
          SEMREL_VERSION: ${{ github.event.release.name }}
          SEMREL_RELEASE_URL: ${{ github.event.release.html_url }}
