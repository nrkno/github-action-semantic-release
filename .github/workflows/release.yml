name: Release

# Release pipeline. Order matters: the container image is built, pushed and
# signed BEFORE the release tag exists, so the tagged commit can contain the
# image's immutable digest in action.yml. A consumer that pins this action to
# a commit SHA therefore pins the exact, signed image that runs.
#
#   plan    -> dry-run semrel: is there a release, and what is its tag?
#   image   -> build + push + cosign sign (keyless) -> image digest
#   release -> commit the digest into action.yml, tag that commit, create the
#              GitHub release
#
# The tagged commit is a child of the released main commit (github.sha) and is
# on no branch. semrel's ancestry-difference range rule (docs/architecture/
# release-image-pinning/decisions/adr-001-*.md) is what makes that safe: later
# pushes to main count only commits not reachable from the tag.
#
# The cosign identity checked by action.yml is THIS workflow on refs/heads/main.
# Do not rename this file or move the image job without updating action.yml.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # required for ListPRsForCommit (PR logging)
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
      - run: go build -o semrel ./cmd/semrel
      - id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./semrel release --dry-run
      # In dry-run mode semrel reports the tag that WOULD be released, or the
      # current latest tag when there is nothing to release. A release is
      # needed only if that tag does not exist yet.
      - id: decide
        env:
          TAG: ${{ steps.semrel.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._/-]*v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected tag from semrel: $TAG"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # A tag without a GitHub release means an earlier run was interrupted
            # after pushing the tag. Do not report "nothing to do".
            if ! gh release view "$TAG" >/dev/null; then
              echo "::error::Tag $TAG exists but its GitHub release could not be read. If the release was never created, create it for the existing tag (gh release create $TAG --verify-tag --generate-notes) and re-run. Do not move or delete the tag: it points at the commit that carries the signed image digest."
              exit 1
            fi
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release needed ($TAG already exists)"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.plan.outputs.tag }}

      - name: Build date
        id: builddate
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.plan.outputs.tag }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.builddate.outputs.date }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    needs: [plan, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # required for ListPRsForCommit (PR logging)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
      - run: go build -o semrel ./cmd/semrel

      # Commit the signed image digest into action.yml. The tag is created on
      # this commit (a child of the main commit, not pushed to any branch).
      - name: Pin image digest in action.yml
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest: $DIGEST"
            exit 1
          fi
          sed -i -E "s#(github-action-semantic-release@sha256:)[0-9a-f]{64}#\1${DIGEST#sha256:}#" action.yml
          if [ "$(grep -c "github-action-semantic-release@${DIGEST}" action.yml)" != 1 ]; then
            echo "::error::Failed to pin the image digest in action.yml"
            exit 1
          fi
          # Fixed dates make the commit a pure function of (github.sha, digest):
          # re-running this job with the same image output recreates the already
          # tagged commit instead of a new one.
          GIT_AUTHOR_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          export GIT_AUTHOR_DATE GIT_COMMITTER_DATE
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(release): pin image digest for ${TAG}" action.yml

      - id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./semrel release

      - name: Check released tag matches the signed image
        env:
          EXPECTED: ${{ needs.plan.outputs.tag }}
          ACTUAL: ${{ steps.semrel.outputs.tag }}
          RELEASED: ${{ steps.semrel.outputs.released }}
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$EXPECTED" =~ ^[A-Za-z0-9._/-]*v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected tag from plan: $EXPECTED"
            exit 1
          fi
          if [ "$RELEASED" != "true" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            # Rerun of an interrupted release: accepted only if the tag already
            # sits on the commit this job just rebuilt AND its release exists.
            tag_commit="$(git rev-parse -q --verify "refs/tags/${EXPECTED}^{commit}" || true)"
            if [ -z "$tag_commit" ] || [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
              echo "::error::semrel released '$ACTUAL' (released=$RELEASED), expected '$EXPECTED'"
              exit 1
            fi
            if ! gh release view "$EXPECTED" >/dev/null; then
              echo "::error::Tag $EXPECTED already points at this commit but has no GitHub release. Create it (gh release create $EXPECTED --verify-tag --generate-notes)."
              exit 1
            fi
          fi
          T="$(git rev-parse "refs/tags/${EXPECTED}^{commit}")"
          # The tag must be a direct, single-parent child of the released main commit.
          if [ "$(git rev-list --parents -n 1 "$T")" != "$T $GITHUB_SHA" ]; then
            echo "::error::Tag $EXPECTED commit $T is not a direct child of $GITHUB_SHA"
            exit 1
          fi
          # The tagged action.yml must carry exactly the signed digest from this run.
          if [ "$(git show "$T:action.yml" | grep -cF "@${DIGEST}" || true)" != 1 ]; then
            echo "::error::action.yml at $T does not contain @${DIGEST} exactly once"
            exit 1
          fi

      - name: Summary
        env:
          TAG: ${{ steps.semrel.outputs.tag }}
        run: |
          {
            echo "### Release ${TAG}"
            echo "Commit SHA (use this to pin the action): \`$(git rev-parse HEAD)\`"
            ./semrel notes
          } >> "$GITHUB_STEP_SUMMARY"
